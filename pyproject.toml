[project]
name = "OlapBranchBench"
version = "1.0.0"
description = "Reproducible benchmarks on OLAP branching"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bauplan~=0.1.14",
    "databricks-sql-connector~=4.3.0",
    "duckdb~=1.5.4",
    "matplotlib~=3.10",
    "polars~=1.41.2",
    "python-dotenv~=1.2.2",
    "snowflake-connector-python~=4.6.0",
    "typer~=0.26.7",
    "uuid~=1.30",
]

[tool.ruff]
line-length = 120
# Bauplan projects are separate deployables whose models must be written the way the framework
# parses them: bauplan.Model(...) in argument defaults (B008), and signatures plain enough for
# ast.literal_eval, which rules out annotating them (ANN001/ANN201)
extend-exclude = ["src/macrobench/workloads/projects"]

[tool.ruff.lint]
select = [
    "ANN",
    "B",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
]
